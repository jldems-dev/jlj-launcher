name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable release tag to validate and build
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Build, verify, and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Validate requested tag and commit
        shell: pwsh
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $tag = $env:RELEASE_TAG_INPUT
          } else {
            $tag = $env:GITHUB_REF_NAME
          }
          if ($tag -notmatch '^v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)$') {
            throw "Release tags must use stable vMAJOR.MINOR.PATCH form. Got: $tag"
          }

          $tagRef = "refs/tags/$tag"
          $tagCommit = (git rev-parse "$tagRef^{commit}").Trim()
          if ($LASTEXITCODE -ne 0) { throw "Tag $tag was not found in the checked out repository." }
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $eventCommit = (git rev-parse "$env:GITHUB_SHA^{commit}").Trim()
            $checkoutCommit = (git rev-parse HEAD).Trim()
            if ($tagCommit -ne $eventCommit -or $checkoutCommit -ne $eventCommit) {
              throw "Checkout does not match the exact commit referenced by $tag"
            }
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_COMMIT=$tagCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check out the requested tag for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Verify exact release commit
        shell: pwsh
        run: |
          $checkoutCommit = (git rev-parse HEAD).Trim()
          if ($checkoutCommit -ne $env:RELEASE_COMMIT) {
            throw "Checkout does not match the immutable commit for $env:RELEASE_TAG"
          }

      - name: Reject an existing release for this tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'jlj-launcher-release-workflow'
          }
          $releaseExists = $false
          try {
            $null = Invoke-RestMethod -Uri $uri -Method Get -Headers $headers -ErrorAction Stop
            $releaseExists = $true
          } catch {
            $apiError = $_
            $statusCode = 0
            if ($null -ne $apiError.Exception.Response) {
              try { $statusCode = [int]$apiError.Exception.Response.StatusCode } catch { $statusCode = 0 }
            }
            if ($statusCode -eq 404) {
              Write-Host "No release exists for $tag; continuing."
            } elseif ($statusCode -ne 0) {
              $body = $apiError.ErrorDetails.Message
              if (-not $body) { $body = $apiError.Exception.Message }
              throw "GitHub API release check failed with HTTP $statusCode for $tag. $body"
            } else {
              throw "GitHub API release check failed for $tag due to a network or transport error: $($apiError.Exception.Message)"
            }
          }
          if ($releaseExists) {
            throw "A GitHub release already exists for $tag; refusing to overwrite it."
          }

      - name: Install dependencies and rebuild native modules
        run: npm ci --no-audit --no-fund

      - name: Validate package version and lockfile
        shell: pwsh
        run: node scripts/validate-release.js --check-project --root . --tag $env:RELEASE_TAG

      - name: Run tests
        run: npm test

      - name: Build the NSIS installer and upload draft assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:RUNNER_TEMP 'electron-builder.log'
          [System.IO.File]::WriteAllText($log, "Electron Builder log for $env:RELEASE_TAG`n")
          npm.cmd run build -- --win nsis --publish always 2>&1 | Tee-Object -FilePath $log -Append
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            exit $buildExitCode
          }

      - name: Validate installer, update metadata, and blockmap
        shell: pwsh
        run: node scripts/validate-release.js --root . --tag $env:RELEASE_TAG --artifacts dist

      - name: Verify uploaded draft assets and metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $remoteDir = Join-Path $env:RUNNER_TEMP 'remote-release-assets'
          New-Item -ItemType Directory -Path $remoteDir | Out-Null

          $releaseJson = gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName,isDraft,assets 2>&1
          $viewExitCode = $LASTEXITCODE
          if ($viewExitCode -ne 0) { throw "Could not read draft release assets for $tag. $($releaseJson -join ' ')" }
          $releaseJsonPath = Join-Path $env:RUNNER_TEMP 'release.json'
          [System.IO.File]::WriteAllText($releaseJsonPath, ($releaseJson -join "`n"), [System.Text.UTF8Encoding]::new($false))

          gh release download $tag --repo $env:GITHUB_REPOSITORY `
            --pattern '*.exe' --pattern '*.exe.blockmap' --pattern latest.yml --dir $remoteDir
          if ($LASTEXITCODE -ne 0) { throw "Could not download required assets from the draft release $tag" }

          node scripts/validate-release.js --root . --tag $tag --artifacts dist `
            --remote-release-json $releaseJsonPath `
            --remote-assets-dir $remoteDir

      - name: Publish the verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest

      - name: Preserve release build logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-build-logs-${{ github.run_id }}
          path: |
            ${{ runner.temp }}\electron-builder.log
            ${{ github.workspace }}\dist\builder-debug.yml
          if-no-files-found: ignore
          retention-days: 14
